name: Ansible Playbooks

on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      playbook:
        description: "Choose the Ansible playbook to run"
        required: true
        type: choice
        options:
          - docker-count.yml
          - docker-login.yml
          - git-pull-reset.yml
          - maint-reboot-required.yml
          - ntp.yml
          - zsh.yml
          - weekly/docker-prune.yml
          - weekly/apt.yml

jobs:
  run-playbook:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up SSH agent
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_ed25519_gha

      - name: Run Playbooks
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          BW_HOST: ${{ secrets.BW_HOST }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use default >/dev/null

          if [ "$(bw status 2>/dev/null | jq -r '.status')" = "unauthenticated" ]; then
            bw login --apikey
          fi

          export BW_SESSION=$(bw unlock --raw --passwordenv BW_PASSWORD)

          if [ -z "${{ github.event.inputs.playbook }}" ]; then
            echo "Running all playbooks in ansible/playbooks/weekly..."
            for playbook in ansible/playbooks/weekly/*.yml; do
              echo "Running $playbook..."
              ansible-playbook \
                -i ansible/inventories/proxmox/inventory.proxmox.yml \
                "$playbook" \
                || echo "Playbook $playbook failed, continuing..."
            done
          else
            echo "Running selected playbook: ${{ github.event.inputs.playbook }}"
            ansible-playbook \
              -i ansible/inventories/proxmox/inventory.proxmox.yml \
              "ansible/playbooks/${{ github.event.inputs.playbook }}"
          fi
