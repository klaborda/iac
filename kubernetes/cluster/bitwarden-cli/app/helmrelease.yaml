---
# yaml-language-server: $schema=https://schemas.mafyuh.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-external-secrets
  namespace: security
spec:
  interval: 15m
  chart:
    spec:
      chart: bitwarden-external-secrets
      version: 0.3.0
      sourceRef:
        kind: HelmRepository
        name: eznix86
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: vaultwarden-credentials
      valuesKey: bw_clientid
      targetPath: secrets.bw_clientid
    - kind: Secret
      name: vaultwarden-credentials
      valuesKey: bw_clientsecret
      targetPath: secrets.bw_clientsecret
    - kind: Secret
      name: vaultwarden-credentials
      valuesKey: bw_password
      targetPath: secrets.bw_password
    - kind: Secret
      name: vaultwarden-credentials
      valuesKey: bw_host
      targetPath: secrets.bw_host
  values:
    image:
      repository: ghcr.io/eznix86/bitwarden-cli
      pullPolicy: IfNotPresent
      tag: latest
    operator:
      image:
        repository: ghcr.io/eznix86/bitwarden-external-secrets-operator
        pullPolicy: IfNotPresent
        tag: latest
  # Fix broken liveness probe hardcoded in chart v0.3.0:
  # busybox wget saves the response body to a file named after the last URL
  # component (sync?force=true); the container runs as non-root uid 100 and
  # can't create files in the working dir, so the probe always fails with
  # "can't open 'sync?force=true': Permission denied" and kubelet kills the
  # pod ~every 6 min. Add -O /dev/null and drop the bogus literal quotes from
  # --post-data='' (exec probes run without a shell).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: bitwarden-cli
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/exec/command
                value:
                  - wget
                  - -q
                  - --post-data=
                  - -O
                  - /dev/null
                  - http://127.0.0.1:8087/sync?force=true
